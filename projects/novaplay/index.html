<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaPlay Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#07050e;color:white;font:16px Arial,sans-serif}nav{padding:22px 5%;display:flex;justify-content:space-between;position:sticky;top:0;background:#07050eee;z-index:5}nav b,em{color:#b8ff2d}.hero{min-height:78vh;padding:12vh 6%;background:radial-gradient(circle at 75% 45%,#7216ff55,transparent 30%),linear-gradient(135deg,#07050e,#120a24);display:flex;align-items:center}h1{font-size:clamp(58px,10vw,140px);line-height:.78;margin:20px 0;letter-spacing:-6px}.tag{color:#b8ff2d;letter-spacing:3px}.btn{display:inline-block;padding:15px 22px;background:#b8ff2d;color:#08050e;text-decoration:none;font-weight:bold;margin:20px 10px 0 0}.section{padding:75px 6%}.head{display:flex;justify-content:space-between;align-items:center}.search{background:#151026;border:1px solid #3c2c64;color:#fff;padding:14px;min-width:260px}.filters button{background:#151026;color:#aaa;border:1px solid #352850;padding:10px 18px;margin:5px;cursor:pointer}.filters button.active{background:#b8ff2d;color:#08050e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.game{min-height:200px;padding:24px;background:linear-gradient(145deg,#24174a,#100b20);border:1px solid #3b2b64;display:flex;flex-direction:column;justify-content:flex-end;transition:.3s}.game:hover{transform:translateY(-8px);border-color:#b8ff2d}.game small{color:#b8ff2d}.ticker{overflow:hidden;white-space:nowrap;padding:18px;background:#b8ff2d;color:#08050e;font-weight:bold;word-spacing:45px}.empty{display:none;color:#aaa}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{display:block}.search{width:100%}h1{letter-spacing:-3px}}</style></head><body><nav><b>NOVA PLAY</b><span>NEXT-GEN GAMING</span></nav><section class="hero"><div><span class="tag">NOVA PLAY / NEXT-GEN GAMING</span><h1>ENTER THE<br><em>NEXT LEVEL.</em></h1><p>Discover legendary games, cinematic worlds and your next gaming obsession.</p><a class="btn" href="#games">EXPLORE GAMES</a></div></section><div class="ticker">GTA VI · FORZA HORIZON 5 · CARX STREET · DRAGON BALL · FIFA · GTA V</div><section class="section" id="games"><div class="head"><div><span class="tag">THE COLLECTION</span><h2>HOT <em>GAMES</em></h2></div><input class="search" id="search" placeholder="Search games..."></div><div class="filters"><button class="active" data-filter="all">ALL</button><button data-filter="action">ACTION</button><button data-filter="racing">RACING</button><button data-filter="sports">SPORTS</button><button data-filter="anime">ANIME</button></div><div class="grid" id="grid"></div><p class="empty">No game found.</p></section><script>const games=[['GTA VI','action'],['Forza Horizon 5','racing'],['CarX Street','racing'],['EA Sports FC','sports'],['Dragon Ball Sparking','anime'],['GTA V','action'],['Car Parking Multiplayer 2','racing'],['Ben 10 Power Trip','action'],['FIFA 26','sports']];let active='all';function draw(){let q=document.querySelector('#search').value.toLowerCase(),list=games.filter(g=>(active==='all'||g[1]===active)&&g[0].toLowerCase().includes(q));document.querySelector('#grid').innerHTML=list.map((g,i)=>`<article class="game"><small>${g[1].toUpperCase()}</small><h3>${g[0]}</h3><span>EXPLORE →</span></article>`).join('');document.querySelector('.empty').style.display=list.length?'none':'block'}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelector('.filters .active').classList.remove('active');b.classList.add('active');active=b.dataset.filter;draw()});document.querySelector('#search').oninput=draw;draw();</script></body></html>
